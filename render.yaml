services:
  - type: web
    name: infoflow-ai
    runtime: docker
    plan: starter
    region: singapore
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    disk:
      name: infoflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
