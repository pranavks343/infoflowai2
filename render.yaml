services:
  - type: web
    name: infoflow-ai
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /tmp/infoflow-data
